<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student login · Smart Canteen</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="auth"><aside><a class="logo" href="index.html"><i>S</i>Smart Canteen</a><div><h1 style="font-size:clamp(2rem,4vw,3rem)">Your lunch is already in the queue.</h1><p>Log in to order, track your pickup time and collect with a one-time code.</p></div><small>Student portal</small></aside>
<main><form class="card" id="studentLoginForm"><h2>Welcome back</h2><p>Sign in using your registered college email or USN to access your Smart Canteen account.</p>
<label for="identifier">Email or USN</label><input id="identifier" autocomplete="username" placeholder="name@nie.ac.in or 4NI21CS001" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<p class="err" id="error" role="alert"></p><button class="btn block" type="submit">Log in</button>
<p class="alt-link">New here? <a href="register.html">Create an account</a></p></form></main></div><script src="js/api.js"></script><script src="js/studentAuth.js"></script></body></html>
