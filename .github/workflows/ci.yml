name: CI/CD

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- 1. CI: check the code ----------
  checks:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend and test dependencies
        working-directory: server
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find server client/js -type f -name '*.js' \
            -not -path 'server/node_modules/*' -print0 |
            xargs -0 -n1 node --check

      # --if-present: a missing test script is skipped instead of failing the pipeline
      - name: Run backend logic tests
        working-directory: server
        run: npm test --if-present

      - name: Install Chromium for browser tests
        if: ${{ hashFiles('server/playwright.config.*') != '' }}
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: ${{ hashFiles('server/playwright.config.*') != '' }}
        working-directory: server
        run: npm run test:e2e --if-present

      - name: Run MongoDB order integration tests
        working-directory: server
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/smart_canteen_test
        run: npm run test:integration --if-present

  # ---------- Pull requests: make sure the Docker image still builds (nothing is pushed) ----------
  docker-build-check:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 2. Build the image and push it to Docker Hub ----------
  docker-publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/smart-canteen:latest
            ${{ vars.DOCKERHUB_USERNAME }}/smart-canteen:${{ github.sha }}

  # ---------- 3. CD: pull the published image from Docker Hub, run it, and test it ----------
  deploy-verify:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      JWT_SECRET: ci-smoke-test-secret-${{ github.run_id }}
      ADMIN_EMAIL: admin@canteen.com
      ADMIN_PASSWORD: SmokeTest123

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image that was just published
        run: docker pull "$DOCKERHUB_USERNAME/smart-canteen:$IMAGE_TAG"

      - name: Start the app and MongoDB from the pulled image
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120

      - name: Create the admin account and menu
        run: |
          docker compose -f docker-compose.prod.yml exec -T app node scripts/seed.js

      - name: Smoke tests
        run: |
          set -e
          echo "Menu API:"; curl -fsS http://localhost:3000/api/menu; echo
          echo "Website:"; curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/login.html

          echo "Non-college email must be rejected:"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"Bad","email":"someone@gmail.com","usn":"4NI21CS001","password":"secret1"}')
          echo "HTTP $code"; test "$code" = "400"

          echo "Admin login must work:"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"admin@canteen.com","password":"SmokeTest123"}')
          echo "HTTP $code"; test "$code" = "200"

      - name: Show container logs (only if something failed)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 80

      - name: Shut down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v